name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-style:
    name: "Check Code Style (Pint)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Setup Composer Cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-php-8.2-locked

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run Pint
        run: vendor/bin/pint --test

  static-analysis:
    name: "Static Analysis (PHPStan)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Setup Composer Cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-php-8.2-locked

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

  test:
    name: "P${{ matrix.php }} - F${{ matrix.filament }} - L${{ matrix.laravel }} - PHPUnit"
    runs-on: ubuntu-latest
    needs: [ code-style, static-analysis ]
    strategy:
      fail-fast: true
      matrix:
        include:
          - php: '8.2'
            filament: '^4.0'
            livewire: '^3.5'
            laravel: '^11.0'
            testbench: '^9.0'
          - php: '8.3'
            filament: '^5.0'
            livewire: '^4.1'
            laravel: '^12.0'
            testbench: '^10.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Setup Composer Cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-php-${{ matrix.php }}-filament-${{ matrix.filament }}-laravel-${{ matrix.laravel }}

      - name: Install dependencies
        run: |
          composer require "filament/filament:${{ matrix.filament }}" "livewire/livewire:${{ matrix.livewire }}" "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --ci
